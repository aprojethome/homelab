version: "3.9"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped

    environment:
      TZ: "Europe/Paris"
      WEBPASSWORD: "changermotdepasse"
      DNSMASQ_USER: "root"

    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"

    dns:
      - 127.0.0.1
      - 1.1.1.1

    cap_add:
      - NET_ADMIN
